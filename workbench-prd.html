  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    html,body{height:100%}
    body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#fff}
    #root{height:100vh;overflow:hidden;display:flex;flex-direction:column}
    select{appearance:auto}
    button,textarea,select{font-family:inherit}
    ::-webkit-scrollbar{width:6px}
    ::-webkit-scrollbar-thumb{background:#e0e0e0;border-radius:6px}
    .scrollable::-webkit-scrollbar{width:6px}
    .scrollable::-webkit-scrollbar-thumb{background:#e0e0e0;border-radius:6px;border:2px solid #fff}
    @keyframes spin{to{transform:rotate(360deg)}}
    @keyframes shimmer{0%{background-position:-200% 0}100%{background-position:200% 0}}
    .spinner{width:15px;height:15px;border:2px solid #e5e5e5;border-top-color:#111;border-radius:50%;animation:spin .8s linear infinite;flex-shrink:0}
    .skel{background:linear-gradient(90deg,#f0f0f0 25%,#e0e0e0 50%,#f0f0f0 75%);background-size:200% 100%;animation:shimmer 1.4s infinite}
    .ta:focus{border-color:#111!important;background:#fff!important;box-shadow:0 0 0 3px rgba(0,0,0,.06)!important;outline:none}
    .prd-ta:hover{border-color:#e5e5e5!important;background:#fafafa!important;padding:8px 10px!important}
    .prd-ta:focus{border-color:#111!important;background:#fff!important;padding:8px 10px!important;box-shadow:0 0 0 3px rgba(0,0,0,.05)!important}
    .topProbRow:hover{background:#fafafa!important}
    textarea{resize:vertical}
    #loading-screen{display:flex;align-items:center;justify-content:center;height:100vh;font-size:14px;color:#888;gap:10px}
    .boot-spinner{width:18px;height:18px;border:2px solid #e5e5e5;border-top-color:#111;border-radius:50%;animation:spin .8s linear infinite}
  </style>
</head>
